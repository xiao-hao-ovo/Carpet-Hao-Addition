// 26.2 独立子工程:26.x 起 Minecraft 不再混淆,使用 Loom 新插件(net.fabricmc.fabric-loom),
// 不声明 mappings,依赖使用 implementation(而非 modImplementation / remapJar)。
plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = "${mod_version}+${minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'MasaMaven'
        url = 'https://masa.dy.fi/maven'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "carpet:fabric-carpet:${project.carpet_version}"
    // 投影轻松放置补水规则需要 Litematica(硬依赖)
    implementation "maven.modrinth:litematica:${project.litematica_version}"
    implementation "maven.modrinth:malilib:${project.malilib_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
}

// carpet 依赖下限取该版本 carpet 坐标的主版本(如 26.1+v260401 -> 26.1)
ext.carpet_min_version = project.carpet_version.split(/\+/)[0]

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'carpet_min_version', project.carpet_min_version
    filesMatching('fabric.mod.json') {
        expand version: project.version,
               minecraft_version: project.minecraft_version,
               carpet_min_version: project.carpet_min_version
    }
}
