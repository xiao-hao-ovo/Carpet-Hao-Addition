name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all versions
        run: ./gradlew build --no-daemon --console=plain

      - name: Show produced jars
        run: ls -l build/libs/*.jar

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: carpet-hao-addition-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

  build-modern:
    name: Build modern (26.x)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: modern/26.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ${{ matrix.dir }}/gradlew

      - name: Build
        run: ${{ matrix.dir }}/gradlew -p ${{ matrix.dir }} build --no-daemon --console=plain

      - name: Show produced jars
        run: ls -l ${{ matrix.dir }}/build/libs/*.jar

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: carpet-hao-addition-modern-jars
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: error
