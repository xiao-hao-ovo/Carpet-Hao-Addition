name: Build & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 1.21.x (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all 1.21.x versions
        run: ./gradlew build --no-daemon --console=plain

      - name: Show produced jars
        run: ls -l build/libs/*.jar

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-1.21x
          path: build/libs/*.jar
          if-no-files-found: error

  build-modern:
    name: Build modern ${{ matrix.label }} (JDK 25)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: modern/26.2, label: '26.2' }
          - { dir: modern/26.1.2, label: '26.1.2' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ${{ matrix.dir }}/gradlew

      - name: Build
        run: ${{ matrix.dir }}/gradlew -p ${{ matrix.dir }} build --no-daemon --console=plain

      - name: Show produced jars
        run: ls -l ${{ matrix.dir }}/build/libs/*.jar

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-modern-${{ matrix.label }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: error

  # 打 tag(如 v0.1.3)时:把 10 个 jar 传到 GitHub Release,并自动上传到 CurseForge / Modrinth。
  # 需要仓库 secret(都可选,缺哪个就跳过哪个):
  #   CURSEFORGE_API_KEY  可选 repository variable:CURSEFORGE_PROJECT_ID(默认 1689732)
  #   MODRINTH_TOKEN      需要 PROJECT_CREATE / VERSION_CREATE 权限
  # Modrinth 首次运行会自动创建「草稿」项目并上传全部版本;项目是否公开由人工确认
  # (python tools/publish_modrinth.py publish),CI 不会自动公开。
  publish:
    name: Publish (GitHub Release + CurseForge + Modrinth)
    needs: [ build, build-modern ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect jars
        run: |
          mkdir -p jars
          find dist -name '*.jar' ! -name '*sources*' -exec cp -v {} jars/ \;
          ls -l jars

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true

      - name: Check publish tokens
        id: tok
        run: |
          echo "cf=${{ secrets.CURSEFORGE_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "mr=${{ secrets.MODRINTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.tok.outputs.cf == 'true' || steps.tok.outputs.mr == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upload to CurseForge
        if: steps.tok.outputs.cf == 'true'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || '1689732' }}
        run: python tools/publish_curseforge.py versions --dir jars

      - name: Skip note (CurseForge)
        if: steps.tok.outputs.cf != 'true'
        run: echo "::warning::未配置 CURSEFORGE_API_KEY secret,已跳过 CurseForge 上传"

      - name: Upload to Modrinth
        if: steps.tok.outputs.mr == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python tools/publish_modrinth.py versions --dir jars

      - name: Skip note (Modrinth)
        if: steps.tok.outputs.mr != 'true'
        run: echo "::warning::未配置 MODRINTH_TOKEN secret,已跳过 Modrinth 上传"
